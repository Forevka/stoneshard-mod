# Builds the loader (native version.dll + managed runtime) and every mod, and
# packs them with tools/package-release.ps1.
#
# A pushed tag v<Version> (matching <Version> in managed/CoreLoader/CoreLoader.csproj)
# creates a DRAFT release with the zips. Mods written against a generated interop
# (FastTravel, Reliquary) cannot be built here - there is no game - so add them
# from a machine with Stoneshard installed, then publish the draft:
#
#   dotnet build managed\CoreLoader.sln -c Release
#   tools\package-release.ps1 -Mods FastTravel,Reliquary -NoLoader -Upload v<Version>
#
# Run by hand (workflow_dispatch), it builds and keeps the zips as a workflow
# artifact without releasing anything.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the loader version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content managed/CoreLoader/CoreLoader.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:TAG) {
            throw "tag $env:TAG does not match <Version>$version</Version> in CoreLoader.csproj"
          }

      - name: Build the native loader
        run: |
          cmake -S . -B build -A x64   # the newest Visual Studio on the runner
          cmake --build build --config Release

      - name: Build the managed runtime and mods
        run: dotnet build managed/CoreLoader.sln -c Release

      - name: Test the analyzers
        run: dotnet test managed/CoreLoader.Analyzers.Tests -c Release --no-build

      - name: Package
        run: tools/package-release.ps1 -BundleRuntime

      - uses: actions/upload-artifact@v4
        with:
          name: lodestone
          path: dist/*.zip

      # Fails if the release already exists: delete the draft to re-run a tag.
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          # This version's section of each changelog (the loader's, then the shipped mods'), when there is one.
          function Section($path) {
              $text = Get-Content $path -Raw
              $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## |^\[[^\]]+\]: |\z)")
              if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          }
          $loader = Section 'CHANGELOG.md'
          $mods = Section 'managed/Mods/CHANGELOG.md'
          $notes = if ($loader) { $loader } else { "Lodestone $version" }
          if ($mods) { $notes += "`n`n## Mods`n`n" + ($mods -replace '(?m)^### ', '#### ') }
          $notes += "`n`n**Install:** extract ``Lodestone-$version-win64.zip`` into the game folder (next to the .exe), then any mod zips the same way. INSERT opens the overlay."
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create $env:TAG (Get-ChildItem dist/*.zip).FullName --draft --title "Lodestone $version" --notes-file notes.md
